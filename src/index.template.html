<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>WebGL 流体按钮</title>
  <style>
    :root{color-scheme:light;--page:#f5f3f8;--panel:#f8f7fa;--ink:#222731;--muted:#8a8e99;--blue:#3269d8}
    *{box-sizing:border-box}body{margin:0;min-width:320px;background:var(--page);color:var(--ink);font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif}
    main{min-height:100dvh;padding:clamp(18px,3vw,42px)}.panel{width:min(1320px,100%);min-height:calc(100dvh - 84px);margin:auto;padding:clamp(28px,5vw,72px);border:1px solid rgba(255,255,255,.9);border-radius:24px;background:var(--panel);box-shadow:0 24px 80px rgba(66,63,88,.08)}
    header{max-width:760px;margin-bottom:clamp(42px,6vw,76px)}.kicker{margin:0 0 16px;color:var(--blue);font-size:12px;font-weight:700;letter-spacing:.18em}h1{max-width:12em;margin:0;font-size:clamp(40px,5vw,72px);font-weight:620;letter-spacing:-.055em;line-height:1.06}header p:last-child{max-width:38em;margin:22px 0 0;color:#717784;font-size:15px;line-height:1.7}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:30px 26px}button{position:relative;z-index:1;display:block;min-width:0;min-height:174px;overflow:hidden;padding:0;border:1px solid rgba(74,84,104,.08);border-radius:999px;background:#fdfdfc;color:var(--ink);text-align:left;cursor:pointer;touch-action:manipulation;box-shadow:0 20px 44px rgba(77,87,116,.14);transition:transform .38s cubic-bezier(.16,1,.3,1),border-color .38s,box-shadow .38s;animation:enter .62s cubic-bezier(.16,1,.3,1) both;animation-delay:var(--delay)}button:hover,button:focus-visible{z-index:2;transform:translateY(-5px) scale(1.055);border-color:rgba(87,94,247,.24);box-shadow:0 30px 62px rgba(75,75,145,.2)}button:active{transform:translateY(-2px) scale(1.025)}button:focus-visible{outline:3px solid rgba(82,98,242,.26);outline-offset:5px}
    .copy{position:relative;z-index:1;isolation:isolate;display:flex;width:45%;min-width:168px;min-height:174px;flex-direction:column;justify-content:center;gap:11px;padding:34px 16px 34px clamp(34px,4vw,56px);background:transparent}.copy:before{content:"";position:absolute;inset:0 -155% 0 0;z-index:-1;pointer-events:none;background:linear-gradient(90deg,rgba(253,253,252,.9) 0 18%,rgba(253,253,252,.62) 29%,rgba(253,253,252,.18) 44%,transparent 58%)}strong{overflow:hidden;font-size:clamp(19px,1.7vw,24px);font-weight:650;letter-spacing:.08em;white-space:nowrap;text-overflow:ellipsis}small{color:#777d89;font-size:13px;letter-spacing:.12em;white-space:nowrap}
    .field{position:absolute;inset:0;z-index:0;overflow:hidden;background:#fdfdfc}iframe{display:block;width:100%;height:100%;min-height:174px;border:0;pointer-events:none}footer{display:flex;flex-wrap:wrap;gap:10px 26px;margin-top:34px;color:var(--muted);font-size:12px}footer span+span:before{content:"/";margin-right:26px;color:rgba(24,33,42,.24)}
    @keyframes enter{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}@media(max-width:900px){.grid{grid-template-columns:1fr}.panel{padding:32px 22px}.grid{gap:24px}}@media(max-width:520px){main{padding:10px}.panel{min-height:calc(100dvh - 20px);padding:28px 14px 22px;border-radius:18px}header{margin-bottom:34px}h1{font-size:38px}button{min-height:132px}.copy{width:47%;min-width:126px;min-height:132px;padding:26px 10px 26px 26px}iframe{min-height:132px}footer{display:grid;gap:7px}footer span+span:before{content:none}}@media(prefers-reduced-motion:reduce){button{animation:none;transition:none}button:hover,button:focus-visible,button:active{transform:none}}
  </style>
</head>
<body>
  <main><section class="panel">
    <header><p class="kicker">WEBGL FLUID BUTTONS</p><h1>一股颜色，持续流动。</h1><p>每个按钮都有自己的混色配方；流体从右侧缓慢进入，悬停时按钮放大，流动同步加速。</p></header>
    <div class="grid">
      <button style="--delay:0ms"><span class="copy"><strong>开始探索</strong><small>FLOWING</small></span><span class="field"><iframe data-variant="0" title="开始探索流体效果"></iframe></span></button>
      <button style="--delay:80ms"><span class="copy"><strong>查看作品</strong><small>SPECTRA</small></span><span class="field"><iframe data-variant="1" title="查看作品流体效果"></iframe></span></button>
      <button style="--delay:160ms"><span class="copy"><strong>继续阅读</strong><small>IN MOTION</small></span><span class="field"><iframe data-variant="2" title="继续阅读流体效果"></iframe></span></button>
      <button style="--delay:240ms"><span class="copy"><strong>确认选择</strong><small>SELECTED</small></span><span class="field"><iframe data-variant="3" title="确认选择流体效果"></iframe></span></button>
    </div>
    <footer><span>胶囊蒙版</span><span>独立混色配方</span><span>悬停加速</span></footer>
  </section></main>
  <script>
    const fluidSource=__FLUID_SOURCE_JSON__;
    const makeFrameDocument=variant=>`<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>html,body,canvas{width:100%;height:100%;margin:0;overflow:hidden;background:#fdfdfc}canvas{display:block}</style></head><body><canvas aria-hidden="true"></canvas><script>window.__FLUID_VARIANT__=${variant};<\/script><script>${fluidSource.replace(/<\/script/gi,"<\\/script")}<\/script></body></html>`;
    document.querySelectorAll("button").forEach(button=>{
      const frame=button.querySelector("iframe"),variant=Number(frame.dataset.variant)||0;
      frame.src=URL.createObjectURL(new Blob([makeFrameDocument(variant)],{type:"text/html"}));
      const send=active=>frame.contentWindow?.postMessage({type:"fluid-hover",active},"*");
      button.addEventListener("pointerenter",()=>send(true));button.addEventListener("pointerleave",()=>send(false));button.addEventListener("focus",()=>send(true));button.addEventListener("blur",()=>send(false));
    });
  </script>
</body>
</html>
