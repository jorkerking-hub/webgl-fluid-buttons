<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>WebGL 流体按钮</title>
  <style>
    :root{color-scheme:light;--page:#f5f3f8;--panel:#f8f7fa;--ink:#222731;--muted:#8a8e99;--blue:#3269d8}
    *{box-sizing:border-box}body{margin:0;min-width:320px;background:var(--page);color:var(--ink);font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif}
    main{min-height:100dvh;padding:clamp(18px,3vw,42px)}.panel{width:min(1320px,100%);min-height:calc(100dvh - 84px);margin:auto;padding:clamp(28px,5vw,72px);border:1px solid rgba(255,255,255,.9);border-radius:24px;background:var(--panel);box-shadow:0 24px 80px rgba(66,63,88,.08)}
    header{max-width:760px;margin-bottom:clamp(42px,6vw,76px)}.kicker{margin:0 0 16px;color:var(--blue);font-size:12px;font-weight:700;letter-spacing:.18em}h1{max-width:12em;margin:0;font-size:clamp(40px,5vw,72px);font-weight:620;letter-spacing:-.055em;line-height:1.06}header p:last-child{max-width:38em;margin:22px 0 0;color:#717784;font-size:15px;line-height:1.7}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:30px 26px}button{--tilt-x:0deg;--tilt-y:0deg;--copy-x:0px;--copy-y:0px;--spot-x:76%;--spot-y:50%;position:relative;z-index:1;display:block;min-width:0;min-height:174px;overflow:hidden;padding:0;border:1px solid rgba(74,84,104,.08);border-radius:999px;background:#fdfdfc;color:var(--ink);text-align:left;cursor:pointer;touch-action:manipulation;box-shadow:0 20px 44px rgba(77,87,116,.14);transform:perspective(900px) translate3d(0,0,0) scale(1) rotateX(var(--tilt-x)) rotateY(var(--tilt-y));transform-style:preserve-3d;transition:transform .58s cubic-bezier(.16,1,.3,1),border-color .42s,box-shadow .58s;animation:enter .62s cubic-bezier(.16,1,.3,1) both;animation-delay:var(--delay);will-change:transform}button:after{content:"";position:absolute;inset:0;z-index:3;border-radius:inherit;pointer-events:none;background:radial-gradient(220px circle at var(--spot-x) var(--spot-y),rgba(255,255,255,.34),rgba(255,255,255,.08) 34%,transparent 68%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.18);opacity:0;transition:opacity .42s ease}button:is(:hover,.is-hovered){z-index:2;transform:perspective(900px) translate3d(0,-7px,0) scale(1.042) rotateX(var(--tilt-x)) rotateY(var(--tilt-y));border-color:rgba(87,94,247,.18);box-shadow:0 31px 64px rgba(75,75,145,.18)}button:is(:hover,.is-hovered):after{opacity:1}button:active{transform:perspective(900px) translate3d(0,-2px,0) scale(.995) rotateX(var(--tilt-x)) rotateY(var(--tilt-y))}button:focus-visible{z-index:2;outline:3px solid rgba(82,98,242,.26);outline-offset:5px;transform:translateY(-5px) scale(1.025)}
    .copy{position:relative;z-index:4;isolation:isolate;display:flex;width:47%;min-width:196px;min-height:174px;flex-direction:column;justify-content:center;gap:10px;padding:34px 14px 34px clamp(34px,4vw,56px);background:transparent;transform:translate3d(var(--copy-x),var(--copy-y),24px);transition:transform .62s cubic-bezier(.16,1,.3,1)}.copy:before{content:"";position:absolute;inset:0 -155% 0 0;z-index:-1;pointer-events:none;background:linear-gradient(90deg,rgba(253,253,252,.92) 0 18%,rgba(253,253,252,.66) 30%,rgba(253,253,252,.2) 45%,transparent 60%)}strong{overflow:hidden;font-size:clamp(20px,1.8vw,26px);font-weight:650;letter-spacing:.1em;white-space:nowrap;text-overflow:ellipsis}small{overflow:hidden;color:#707784;font-size:12px;font-weight:520;letter-spacing:.08em;white-space:nowrap;text-overflow:ellipsis}
    .field{position:absolute;inset:0;z-index:0;overflow:hidden;background:#fdfdfc}iframe{display:block;width:100%;height:100%;min-height:174px;border:0;pointer-events:none}footer{display:flex;flex-wrap:wrap;gap:10px 26px;margin-top:34px;color:var(--muted);font-size:12px}footer span+span:before{content:"/";margin-right:26px;color:rgba(24,33,42,.24)}
    @keyframes enter{from{opacity:0;translate:0 16px}to{opacity:1;translate:0 0}}@media(max-width:900px){.grid{grid-template-columns:1fr}.panel{padding:32px 22px}.grid{gap:24px}}@media(max-width:520px){main{padding:10px}.panel{min-height:calc(100dvh - 20px);padding:28px 14px 22px;border-radius:18px}header{margin-bottom:34px}h1{font-size:38px}button{min-height:132px}.copy{width:52%;min-width:154px;min-height:132px;padding:26px 8px 26px 26px}small{font-size:10px;letter-spacing:.045em}iframe{min-height:132px}footer{display:grid;gap:7px}footer span+span:before{content:none}}@media(prefers-reduced-motion:reduce){button,.copy,button:after{animation:none;transition:none}button.is-hovered,button:focus-visible,button:active{transform:none}.copy{transform:none}}
  </style>
</head>
<body>
  <main><section class="panel">
    <header><p class="kicker">WEBGL FLUID BUTTONS</p><h1>一股颜色，持续流动。</h1><p>每一枚按钮都封存着自己的色谱。靠近时，光、文字与流体会跟随你的动作醒来。</p></header>
    <div class="grid">
      <button style="--delay:0ms"><span class="copy"><strong>夜航蓝</strong><small>钴蓝 / 鸢尾紫 / 极光青</small></span><span class="field"><iframe data-variant="0" title="夜航蓝流体色谱"></iframe></span></button>
      <button style="--delay:80ms"><span class="copy"><strong>暮光紫</strong><small>紫罗兰 / 胭脂粉 / 靛青</small></span><span class="field"><iframe data-variant="1" title="暮光紫流体色谱"></iframe></span></button>
      <button style="--delay:160ms"><span class="copy"><strong>潮汐青</strong><small>松石青 / 湖水蓝 / 苔绿</small></span><span class="field"><iframe data-variant="2" title="潮汐青流体色谱"></iframe></span></button>
      <button style="--delay:240ms"><span class="copy"><strong>晚霞绯</strong><small>玫瑰绯 / 琥珀橙 / 暮紫</small></span><span class="field"><iframe data-variant="3" title="晚霞绯流体色谱"></iframe></span></button>
    </div>
    <footer><span>胶囊蒙版</span><span>独立混色配方</span><span>磁吸漂浮</span><span>指针牵引流体</span></footer>
  </section></main>
  <script>
    const fluidSource=__FLUID_SOURCE_JSON__;
    const makeFrameDocument=variant=>`<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>html,body,canvas{width:100%;height:100%;margin:0;overflow:hidden;background:#fdfdfc}canvas{display:block}</style></head><body><canvas aria-hidden="true"></canvas><script>window.__FLUID_VARIANT__=${variant};<\/script><script>${fluidSource.replace(/<\/script/gi,"<\\/script")}<\/script></body></html>`;
    const reduceMotion=matchMedia("(prefers-reduced-motion: reduce)");
    document.querySelectorAll("button").forEach(button=>{
      const frame=button.querySelector("iframe"),variant=Number(frame.dataset.variant)||0;
      frame.src=URL.createObjectURL(new Blob([makeFrameDocument(variant)],{type:"text/html"}));
      const send=active=>frame.contentWindow?.postMessage({type:"fluid-hover",active},"*");
      const reset=()=>{button.classList.remove("is-hovered");button.style.setProperty("--tilt-x","0deg");button.style.setProperty("--tilt-y","0deg");button.style.setProperty("--copy-x","0px");button.style.setProperty("--copy-y","0px");frame.contentWindow?.postMessage({type:"fluid-pointer",y:.5},"*")};
      button.addEventListener("pointerenter",()=>{button.classList.add("is-hovered");send(true)});
      button.addEventListener("pointermove",event=>{if(!button.classList.contains("is-hovered")){button.classList.add("is-hovered");send(true)}if(reduceMotion.matches)return;const rect=button.getBoundingClientRect(),x=(event.clientX-rect.left)/rect.width,y=(event.clientY-rect.top)/rect.height,nx=x-.5,ny=y-.5;button.style.setProperty("--tilt-x",`${-ny*5.2}deg`);button.style.setProperty("--tilt-y",`${nx*6.4}deg`);button.style.setProperty("--copy-x",`${nx*11}px`);button.style.setProperty("--copy-y",`${ny*7}px`);button.style.setProperty("--spot-x",`${x*100}%`);button.style.setProperty("--spot-y",`${y*100}%`);frame.contentWindow?.postMessage({type:"fluid-pointer",y},"*")});
      button.addEventListener("pointerleave",()=>{reset();send(false)});button.addEventListener("focus",()=>send(true));button.addEventListener("blur",()=>{reset();send(false)});
    });
  </script>
</body>
</html>
